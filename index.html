<style id="gate-style">
:root{--paper:#f4f6fa;--sheet:#fff;--ink:#14213d;--muted:#55607a;--rule:#d5dceb;--accent:#e8590c}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);
font-family:"Segoe UI",system-ui,-apple-system,sans-serif;

main{width:100%;max-width:380px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:32px 28px;text-align:center}
.k{font:600 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
h1{font-size:24px;margin:12px 0 6px}
p{color:var(--muted);margin:0 0 20px;line-height:1.5}
input{width:100%;font:600 28px/1 ui-monospace,Menlo,monospace;letter-spacing:.4em;text-align:center;padding:14px 10px;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{margin-top:14px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 16px/1 inherit;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
#msg{min-height:22px;margin:14px 0 0;font-size:14px}
</style>

function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function keyFor(pin){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
function dec(key,u){return crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12))}
async function unlock(pin){
  var key=await keyFor(pin);
  var html=new TextDecoder().decode(await dec(key,b64(PAYLOAD)));
  var doc=new DOMParser().parseFromString(html,"text/html");
  document.head.innerHTML=doc.head.innerHTML;
  document.body.innerHTML=doc.body.innerHTML;
  document.body.className=doc.body.className;
  window.scrollTo(0,0);
  document.querySelectorAll("img[data-enc]").forEach(async function(img){
    try{
      var r=await fetch(img.getAttribute("data-enc"));
      var buf=await dec(key,new Uint8Array(await r.arrayBuffer()));
      img.src=URL.createObjectURL(new Blob([buf],{type:img.getAttribute("data-mime")}));
    }catch(e){}
  });
}
var f=document.getElementById("f"),msg=document.getElementById("msg"),go=document.getElementById("go"),pin=document.getElementById("pin");
async function attempt(p,quiet){
  go.disabled=true;if(!quiet)msg.textContent="Checking…";
  try{await unlock(p);try{sessionStorage.setItem("pp",p)}catch(e){}}
  catch(e){go.disabled=false;if(!quiet){msg.textContent="That PIN is not right. Please try again.";pin.value="";pin.focus()}else{msg.textContent=""}}
}
f.addEventListener("submit",function(e){e.preventDefault();if(pin.value.trim())attempt(pin.value.trim(),false)});
try{var s=sessionStorage.getItem("pp");if(s)attempt(s,true)}catch(e){}
})();
